global:
  scrape_interval: 30s
  evaluation_interval: 30s
rule_files: [/etc/prometheus/alerts.yml]
scrape_configs:
  - job_name: prometheus
    static_configs: [{targets: ['localhost:9090']}]
  - job_name: product
    static_configs: [{targets: ['metrics:9101']}]
  - job_name: host
    static_configs: [{targets: ['node-exporter:9100']}]
  - job_name: containers
    static_configs: [{targets: ['cadvisor:8080']}]
    metric_relabel_configs:
      - source_labels: [container_label_com_docker_compose_project]
        regex: wb-serp
        action: keep
  - job_name: dashboard
    metrics_path: /probe
    params: {module: [http_ok]}
    static_configs: [{targets: ['http://dashboard:8501/_stcore/health']}]
    relabel_configs: &probe_labels
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox:9115
  - job_name: public_https
    metrics_path: /probe
    params: {module: [https_auth_gate]}
    file_sd_configs: [{files: [/etc/prometheus/targets/public.yml]}]
    relabel_configs: *probe_labels
  - job_name: grafana
    metrics_path: /probe
    params: {module: [http_ok]}
    static_configs: [{targets: ['http://grafana:3000/grafana/api/health']}]
    relabel_configs: *probe_labels
