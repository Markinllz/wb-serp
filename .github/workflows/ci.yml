name: Python checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install test and lint requirements
        run: pip install -r requirements-dev.txt
      - name: Lint critical issues
        run: ruff check .
      - name: Unit and integration tests
        run: python -m pytest
