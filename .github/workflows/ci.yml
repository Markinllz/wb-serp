name: Python checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install test and lint requirements
        run: pip install -r requirements-dev.txt
      - name: Lint critical issues
        run: ruff check .
      - name: Unit and integration tests
        run: python -m pytest
      - name: Validate monitoring
        env:
          GRAFANA_ADMIN_PASSWORD: ci-validation-only
          APP_DOMAIN: serp.example.com
        run: |
          docker compose -f compose.yaml -f compose.browser.yaml -f compose.monitoring.yaml --profile public config --quiet
          docker run --rm --entrypoint /bin/promtool -v "$PWD/monitoring:/etc/prometheus:ro" -w /etc/prometheus prom/prometheus:v3.15.0 check config prometheus.yml
          docker run --rm --entrypoint /bin/promtool -v "$PWD/monitoring:/etc/prometheus:ro" -w /etc/prometheus prom/prometheus:v3.15.0 test rules rules.test.yml
