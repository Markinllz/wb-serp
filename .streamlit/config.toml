[theme]
base = "light"
primaryColor = "#2456A6"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F5F6F8"
textColor = "#202630"
font = "sans serif"

[server]
enableCORS = true
enableXsrfProtection = true
headless = true
maxUploadSize = 10

[browser]
gatherUsageStats = false

[client]
toolbarMode = "minimal"
